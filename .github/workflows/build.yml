          xmake build -y systemmonitor-model-tests
          xmake build -y systemmonitor-bench
          xmake run systemmonitor-tests
          xmake run systemmonitor-model-tests
          xmake run systemmonitor-bench
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software xmake run systemmonitor --smoke-test

      - name: Benchmark System Monitor GUI (Linux)
        if: runner.os == 'Linux'
        working-directory: ${{ steps.monitor_project.outputs.directory }}
        shell: bash
        run: |
          exe="$(find build -type f -name systemmonitor -print -quit)"
          test -n "$exe"
          xvfb-run -a env QT_QUICK_BACKEND=software python3 Benchmarks/gui.py --exe "$exe" | tee /tmp/systemmonitor-bench.json
          printf '### System Monitor GUI benchmark\n\n```json\n' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/systemmonitor-bench.json >> "$GITHUB_STEP_SUMMARY"
          printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Build System Monitor Windows installer
        if: runner.os == 'Windows'
        working-directory: ${{ steps.monitor_project.outputs.directory }}
        shell: pwsh
        run: ./Packaging/package-windows.ps1

      - name: Build System Monitor macOS installer
        if: runner.os == 'macOS'
        working-directory: ${{ steps.monitor_project.outputs.directory }}
        shell: bash
        run: bash Packaging/package-macos.sh

      - name: Build System Monitor Linux installer
        if: runner.os == 'Linux'
        working-directory: ${{ steps.monitor_project.outputs.directory }}
        shell: bash
        run: bash Packaging/package-linux.sh

      - name: Upload System Monitor Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.monitor_project.outputs.directory }}/artifacts/SystemMonitor-windows-x64-setup.exe
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload System Monitor macOS installer
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.monitor_project.outputs.directory }}/artifacts/SystemMonitor-macos-arm64.pkg
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload System Monitor Linux installer
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.monitor_project.outputs.directory }}/artifacts/SystemMonitor-linux-x64.deb
          archive: false
          if-no-files-found: error
          retention-days: 14

  browser:
    name: WebBrowser-${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows, arch: x64, runner: windows-2022, platform: windows, xmake_arch: x64, qt_host: windows, qt_arch: win64_msvc2022_64 }
          - { os: linux, arch: x64, runner: ubuntu-24.04, platform: linux, xmake_arch: x86_64, qt_host: linux, qt_arch: linux_gcc_64 }
          - { os: macos, arch: arm64, runner: macos-15, platform: macosx, xmake_arch: arm64, qt_host: mac, qt_arch: clang_64 }
    env:
      QT_VERSION: '6.11.3'
      APP_VERSION: '1.0.0'
      PORTABLE: '0'
    defaults:
      run:
        working-directory: WebBrowser
    steps:
      - uses: actions/checkout@v4
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.1.1'
      - name: Set up Python for Windows Qt installer
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt WebEngine (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          # Install the upstream Qt 6.11 archive-layout fix directly; the
          # composite installer was still executing the old PyPI release.
          python -m pip install --upgrade --force-reinstall --no-cache-dir 'git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7'
          python -m aqt version
          $qtParent = Join-Path $env:RUNNER_WORKSPACE 'Qt'
          python -m aqt install-qt windows desktop $env:QT_VERSION win64_msvc2022_64 --base https://download.qt.io -O $qtParent -m qtwebengine qtwebchannel qtpositioning
          $qt = Join-Path $qtParent "$env:QT_VERSION/msvc2022_64"
          if (!(Test-Path "$qt/bin/qmake.exe") -or !(Test-Path "$qt/bin/Qt6WebEngineCore.dll")) { throw "Incomplete Qt WebEngine SDK at $qt" }
          "QT_ROOT_DIR=$qt" >> $env:GITHUB_ENV
          "QT_PLUGIN_PATH=$qt/plugins" >> $env:GITHUB_ENV
          "QML2_IMPORT_PATH=$qt/qml" >> $env:GITHUB_ENV
          "$qt/bin" >> $env:GITHUB_PATH
      - name: Install Qt WebEngine
        if: runner.os != 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ matrix.qt_host }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          modules: qtwebengine qtwebchannel qtpositioning
          cache-key-prefix: install-qt-action-webbrowser-qt611-v2
          cache: true
      - name: Linux browser dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf xvfb xauth libgl-dev libegl-dev libxcb-cursor0 libxkbcommon-x11-0 libnss3 libnspr4 libasound2t64 libgbm1 libxcomposite1 libxdamage1 libatk1.0-0t64 libatk-bridge2.0-0t64 libxshmfence1 libxrandr2 libxss1 libopengl0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-randr0
      - name: Build and test Browser (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          xmake f -c -y -p windows -a x64 -m release --vs=2022 "--qt=$env:QT_ROOT_DIR"
          xmake build -y webbrowser
          xmake build -y webbrowser-tests
          xmake build -y webbrowser-store-tests
          xmake build -y webbrowser-bench
          xmake run webbrowser-tests
          xmake run webbrowser-store-tests
          xmake run webbrowser-bench
          ./Packaging/package-windows.ps1
      - name: Build and test Browser (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          xmake f -c -y -p "${{ matrix.platform }}" -a "${{ matrix.xmake_arch }}" -m release --qt="$QT_ROOT_DIR"
          xmake build -y webbrowser
          xmake build -y webbrowser-tests
          xmake build -y webbrowser-store-tests
          xmake build -y webbrowser-bench
          xmake run webbrowser-tests
          xmake run webbrowser-store-tests
          xmake run webbrowser-bench
      - name: Package and smoke-test Linux
        if: runner.os == 'Linux'
        shell: bash
        run: bash Packaging/package-linux.sh
      - name: Package and smoke-test macOS
        if: runner.os == 'macOS'
        shell: bash
        run: bash Packaging/package-macos.sh
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          path: WebBrowser/artifacts/WebBrowser-windows-x64-setup.exe
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          path: WebBrowser/artifacts/WebBrowser-linux-x64.deb
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: runner.os == 'macOS'
        with:
          path: WebBrowser/artifacts/WebBrowser-macos-arm64.pkg
          archive: false
          if-no-files-found: error

  browser-ios:
    name: WebBrowser-iOS-${{ matrix.kind }}-${{ matrix.arch }}
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { kind: simulator, arch: x86_64, build_dir: ios-simulator }
          - { kind: device, arch: arm64, build_dir: ios-device }
    steps:
      - uses: actions/checkout@v4
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.1.1'
      - name: Install Qt iOS SDK and host tools
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.3'
          host: mac
          target: ios
          arch: ios
          cache: true
          extra: '--autodesktop'
      - name: Select Xcode
        shell: bash
        run: |
          xc="$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort | tail -1)"
          if [[ -n "$xc" ]]; then sudo xcode-select -s "$xc/Contents/Developer"; fi
          xcodebuild -version
      - name: Build unsigned iOS app
        working-directory: WebBrowser
        run: |
          if [[ "${{ matrix.kind }}" == device ]]; then
            xmake ios-bundle --device --qt="$QT_ROOT_DIR"
          else
            xmake ios-bundle --qt="$QT_ROOT_DIR"
          fi
          app="$(find build/${{ matrix.build_dir }} -type d -name webbrowser.app -print -quit)"
          test -n "$app"
          lipo -verify_arch "${{ matrix.arch }}" "$app/webbrowser"
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent "$app" "artifacts/WebBrowser-ios-${{ matrix.kind }}-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v7
        with:
          path: WebBrowser/artifacts/WebBrowser-ios-${{ matrix.kind }}-${{ matrix.arch }}.zip
          archive: false
          if-no-files-found: error
