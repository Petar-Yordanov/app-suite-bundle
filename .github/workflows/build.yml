# Replaces the obsolete combined workflow so installing this patch removes
# its automatic duplicate builds. This file may also be deleted entirely.
name: Retired combined build (use per-app workflows)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - run: echo 'Use the individual application workflows. This combined build has been retired.'
