name: Build App Suite

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows, arch: x64,   runner: windows-2022, xmake_platform: windows, xmake_arch: x64,    qt_host: windows, qt_arch: win64_msvc2022_64 }
          - { os: linux,   arch: x64,   runner: ubuntu-24.04, xmake_platform: linux,   xmake_arch: x86_64, qt_host: linux,   qt_arch: linux_gcc_64 }
          - { os: macos,   arch: arm64, runner: macos-15,     xmake_platform: macosx,  xmake_arch: arm64,  qt_host: mac,     qt_arch: clang_64 }

    env:
      QT_VERSION: '6.8.3'
      APP_VERSION: '1.0.0'
      ARTIFACT: ClipDeck-${{ matrix.os }}-${{ matrix.arch }}
      PORTABLE: '0'

    steps:
      - uses: actions/checkout@v4

      - name: Locate ClipDeck project
        id: project
        shell: bash
        run: |
          # The source ZIP already contains a ClipboardManager directory.
          # Also accept it if it was extracted inside the existing directory.
          for dir in ClipboardManager ClipboardManager/ClipboardManager; do
            if [[ -f "$dir/xmake.lua" && -f "$dir/App/Controller.cpp" && -f "$dir/Tests/QtIntegrationTests.cpp" ]] &&
               grep -Fq 'target("clipdeck")' "$dir/xmake.lua"; then
              printf 'directory=%s\n' "$dir" >> "$GITHUB_OUTPUT"
              printf 'Building ClipDeck from %s/xmake.lua\n' "$dir"
              exit 0
            fi
          done
          echo '::error::ClipDeck project not found. Extract ClipboardManager.zip at the repository root, so ClipboardManager/xmake.lua and ClipboardManager/App/Controller.cpp exist.'
          exit 1

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxfixes-dev libgl-dev libegl-dev libxcb-cursor0 libxkbcommon-x11-0 patchelf xvfb xauth nasm

      - name: Set up Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.1.1'

      - name: Install Qt SDK
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ matrix.qt_host }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          modules: qtimageformats
          cache: true

      - name: Configure, build and test (Windows MSVC)
        if: runner.os == 'Windows'
        working-directory: ${{ steps.project.outputs.directory }}
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          xmake f -c -y -P . -F xmake.lua -p windows -a x64 -m release --vs=2022 "--qt=$env:QT_ROOT_DIR"
          xmake build -y clipdeck
          xmake build -y clipdeck-tests
          xmake build -y clipdeck-integration-tests
          xmake build -y clipdeck-bench
          xmake run clipdeck-tests

      - name: Configure and build (Linux/macOS Release)
        if: runner.os != 'Windows'
        working-directory: ${{ steps.project.outputs.directory }}
        shell: bash
        run: |
          xmake f -c -y -P . -F xmake.lua -p "${{ matrix.xmake_platform }}" -m release -a "${{ matrix.xmake_arch }}" --qt="$QT_ROOT_DIR"
          xmake build -y clipdeck
          xmake build -y clipdeck-tests
          xmake build -y clipdeck-integration-tests
          xmake build -y clipdeck-bench

      - name: Run storage tests
        if: runner.os != 'Windows'
        working-directory: ${{ steps.project.outputs.directory }}
        shell: bash
        run: xmake run clipdeck-tests

      - name: Run native clipboard integration tests (Linux X11)
        if: runner.os == 'Linux'
        working-directory: ${{ steps.project.outputs.directory }}
        env:
          QT_QPA_PLATFORM: xcb
          QT_QUICK_BACKEND: software
        run: xvfb-run -a xmake run clipdeck-integration-tests

      - name: Run native clipboard integration tests (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ steps.project.outputs.directory }}
        shell: pwsh
        env:
          QT_QUICK_BACKEND: software
        run: xmake run clipdeck-integration-tests

      - name: Run native clipboard integration tests (macOS)
        if: runner.os == 'macOS'
        working-directory: ${{ steps.project.outputs.directory }}
        env:
          QT_QUICK_BACKEND: software
        run: xmake run clipdeck-integration-tests

      - name: Run storage benchmark (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ steps.project.outputs.directory }}
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force artifacts | Out-Null
          xmake run clipdeck-bench | Tee-Object -FilePath "artifacts/$env:ARTIFACT-benchmark.txt"

      - name: Run storage benchmark (Linux/macOS)
        if: runner.os != 'Windows'
        working-directory: ${{ steps.project.outputs.directory }}
        shell: bash
        run: |
          mkdir -p artifacts
          xmake run clipdeck-bench | tee "artifacts/${ARTIFACT}-benchmark.txt"

      - name: Build Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        working-directory: ${{ steps.project.outputs.directory }}
        shell: pwsh
        run: |
          $exe = Get-ChildItem build -Recurse -File -Filter clipdeck.exe | Select-Object -First 1
          if (!$exe) { throw "clipdeck.exe not found" }
          $PSNativeCommandUseErrorActionPreference = $true
          $bundle = Join-Path $PWD "dist/ClipDeck"
          New-Item -ItemType Directory -Force $bundle | Out-Null
          Copy-Item $exe.FullName (Join-Path $bundle "clipdeck.exe")
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --no-compiler-runtime --qmldir "$PWD/UI" "$bundle/clipdeck.exe"
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed" }

          # App-local release CRT avoids installing a separate system runtime.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -version '[17.0,18.0)' -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw "Visual Studio 2022 not found" }
          $crt = Get-ChildItem (Join-Path $vs "VC\Redist\MSVC\*\x64\Microsoft.VC143.CRT") -Directory |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (!$crt) { throw "MSVC x64 redistributable DLLs not found" }
          Copy-Item "$($crt.FullName)\*.dll" $bundle
          Copy-Item "artifacts/$env:ARTIFACT-benchmark.txt" "$bundle/benchmark.txt"

          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if ($iscc) { $compiler = $iscc.Source }
          else { $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (!(Test-Path $compiler)) { throw "Inno Setup compiler not found" }

          @'
          [Setup]
          AppId=org.clipdeck.app
          AppName=ClipDeck
          AppVersion={#AppVersion}
          AppPublisher=ClipDeck
          DefaultDirName={localappdata}\Programs\ClipDeck
          DefaultGroupName=ClipDeck
          PrivilegesRequired=lowest
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          UninstallDisplayIcon={app}\clipdeck.exe
          OutputDir=artifacts
          OutputBaseFilename=ClipDeck-windows-x64-setup
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          CloseApplications=yes
          RestartApplications=no

          [Files]
          Source: "dist\ClipDeck\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Tasks]
          Name: desktopicon; Description: "Create a desktop shortcut"; Flags: unchecked

          [Icons]
          Name: "{autoprograms}\ClipDeck"; Filename: "{app}\clipdeck.exe"
          Name: "{autodesktop}\ClipDeck"; Filename: "{app}\clipdeck.exe"; Tasks: desktopicon

          [Registry]
          Root: HKCU; Subkey: "Software\Microsoft\Windows\CurrentVersion\Run"; ValueType: none; ValueName: "ClipDeck"; Flags: uninsdeletevalue

          [Run]
          Filename: "{app}\clipdeck.exe"; Description: "Launch ClipDeck"; Flags: nowait postinstall skipifsilent
          '@ | Set-Content -Encoding utf8 "clipdeck-installer.iss"
          & $compiler "/DAppVersion=$env:APP_VERSION" "clipdeck-installer.iss"
          if (!(Test-Path "artifacts/$env:ARTIFACT-setup.exe")) { throw "Installer was not created" }

      - name: Build macOS installer (productbuild)
        if: runner.os == 'macOS'
        working-directory: ${{ steps.project.outputs.directory }}
        shell: bash
        run: |
          mkdir -p dist
          bundle="$(find build -type d -iname 'clipdeck.app' -print -quit)"
          if [[ -n "$bundle" ]]; then
            ditto "$bundle" dist/ClipDeck.app
          else
            exe="$(find build -type f -name clipdeck -print -quit)"
            test -n "$exe"
            mkdir -p dist/ClipDeck.app/Contents/MacOS
            cp "$exe" dist/ClipDeck.app/Contents/MacOS/clipdeck
            cat > dist/ClipDeck.app/Contents/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleExecutable</key><string>clipdeck</string>
          <key>CFBundleIdentifier</key><string>org.clipdeck.app</string>
          <key>CFBundleName</key><string>ClipDeck</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleShortVersionString</key><string>1.0.0</string>
          </dict></plist>
          PLIST
          fi
          "$QT_ROOT_DIR/bin/macdeployqt" dist/ClipDeck.app -qmldir="$PWD/UI" -always-overwrite
          plist="dist/ClipDeck.app/Contents/Info.plist"
          for item in "CFBundleIdentifier:org.clipdeck.app" "CFBundleShortVersionString:$APP_VERSION" "CFBundleVersion:$APP_VERSION"; do
            key="${item%%:*}"
            value="${item#*:}"
            /usr/libexec/PlistBuddy -c "Set :$key $value" "$plist" ||
              /usr/libexec/PlistBuddy -c "Add :$key string $value" "$plist"
          done
          mkdir -p dist/ClipDeck.app/Contents/Resources
          cp "artifacts/${ARTIFACT}-benchmark.txt" dist/ClipDeck.app/Contents/Resources/benchmark.txt
          # Ad-hoc signing is sufficient for local testing but is not notarization.
          codesign --force --deep --sign - dist/ClipDeck.app
          codesign --verify --deep --strict dist/ClipDeck.app
          productbuild --component dist/ClipDeck.app /Applications "artifacts/${ARTIFACT}.pkg"

      - name: Build Linux installer (Debian package)
        if: runner.os == 'Linux'
        working-directory: ${{ steps.project.outputs.directory }}
        shell: bash
        run: |
          exe="$(find build -type f -name clipdeck -print -quit)"
          test -n "$exe"
          bundle="$PWD/dist/ClipDeck"
          mkdir -p "$bundle/lib"
          cp "$exe" "$bundle/clipdeck"
          # Copy shared libraries and runtime modules (not SDK headers or tools).
          cp -a "$QT_ROOT_DIR"/lib/*.so* "$bundle/lib/"
          cp -a "$QT_ROOT_DIR/plugins" "$bundle/"
          cp -a "$QT_ROOT_DIR/qml" "$bundle/"
          printf '[Paths]\nPrefix = .\nLibraries = lib\nPlugins = plugins\nQmlImports = qml\n' > "$bundle/qt.conf"

          # Relative RPATH also works when autostart invokes the executable directly.
          patchelf --set-rpath '$ORIGIN/lib' "$bundle/clipdeck"
          while IFS= read -r -d '' lib; do
            relative="$(realpath --relative-to="$(dirname "$lib")" "$bundle/lib")"
            patchelf --set-rpath "\$ORIGIN/$relative" "$lib"
          done < <(find "$bundle/lib" "$bundle/plugins" "$bundle/qml" -type f -name '*.so*' -print0)

          # Smoke-check that the deployed binary can start without the SDK.
          env -u LD_LIBRARY_PATH -u QT_PLUGIN_PATH -u QML2_IMPORT_PATH -u QML_IMPORT_PATH \
            QT_QPA_PLATFORM=offscreen "$bundle/clipdeck" --version
          # Package the private Qt runtime under /opt; no Qt SDK needed on target.
          package="$PWD/dist/deb-root"
          mkdir -p "$package/DEBIAN" "$package/opt" "$package/usr/bin" \
            "$package/usr/share/applications" "$package/usr/share/doc/clipdeck"
          mv "$bundle" "$package/opt/clipdeck"
          ln -s /opt/clipdeck/clipdeck "$package/usr/bin/clipdeck"
          cp "artifacts/${ARTIFACT}-benchmark.txt" "$package/usr/share/doc/clipdeck/benchmark.txt"

          cat > "$package/DEBIAN/control" <<EOF
          Package: clipdeck
          Version: $APP_VERSION
          Architecture: amd64
          Maintainer: ClipDeck
          Section: utils
          Priority: optional
          Depends: libc6 (>= 2.39), libstdc++6, libgcc-s1, libgl1, libegl1, libopengl0, libfontconfig1, libfreetype6, libdbus-1-3, libx11-6, libx11-xcb1, libxcb1, libxcb-cursor0, libxcb-icccm4, libxcb-image0, libxcb-keysyms1, libxcb-render-util0, libxcb-randr0, libxcb-render0, libxcb-shape0, libxcb-shm0, libxcb-sync1, libxcb-xfixes0, libxcb-xkb1, libxkbcommon0, libxkbcommon-x11-0, libwayland-client0, libwayland-cursor0, libwayland-egl1, libdrm2, libglib2.0-0t64, libssl3t64, libz1
          Description: Lightweight local clipboard history manager
           Native Qt clipboard manager with local history, search and file snapshots.
          EOF
          cat > "$package/usr/share/applications/org.clipdeck.app.desktop" <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=ClipDeck
          Comment=Local clipboard history
          Exec=/opt/clipdeck/clipdeck --show
          Icon=edit-paste
          Terminal=false
          Categories=Utility;
          DESKTOP
          dpkg-deb --root-owner-group --build "$package" "artifacts/${ARTIFACT}.deb"
          dpkg-deb --info "artifacts/${ARTIFACT}.deb"

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.project.outputs.directory }}/artifacts/${{ env.ARTIFACT }}-setup.exe
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload macOS installer
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.project.outputs.directory }}/artifacts/${{ env.ARTIFACT }}.pkg
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux installer
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.project.outputs.directory }}/artifacts/${{ env.ARTIFACT }}.deb
          archive: false
          if-no-files-found: error
          retention-days: 14

      # Image Viewer uses the same runner, Qt SDK and Xmake installation.
      - name: Locate ImageViewer project
        id: imageviewer_project
        shell: bash
        run: |
          for dir in ImageViewer ImageViewer/ImageViewer; do
            if [[ -f "$dir/xmake.lua" && -f "$dir/App/main.cpp" && -f "$dir/Core/Decoder.cpp" && -f "$dir/UI/Main.qml" && -f "$dir/Tests/IntegrationTests.cpp" ]] &&
               grep -Fq 'target("imageviewer")' "$dir/xmake.lua"; then
              printf 'directory=%s\n' "$dir" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo '::error::ImageViewer project not found. Extract ImageViewer.zip at the repository root, preserving its directories.'
          exit 1

      - name: Configure and build ImageViewer (Windows MSVC)
        if: runner.os == 'Windows'
        working-directory: ${{ steps.imageviewer_project.outputs.directory }}
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          xmake f -c -y -P . -F xmake.lua -p windows -a x64 -m release --vs=2022 "--qt=$env:QT_ROOT_DIR"
          xmake build -y imageviewer
          xmake build -y imageviewer-metadata-tests
          xmake build -y imageviewer-tests
          xmake build -y imageviewer-bench

      - name: Configure and build ImageViewer (Linux/macOS Release)
        if: runner.os != 'Windows'
        working-directory: ${{ steps.imageviewer_project.outputs.directory }}
        shell: bash
        run: |
          xmake f -c -y -P . -F xmake.lua -p "${{ matrix.xmake_platform }}" -a "${{ matrix.xmake_arch }}" -m release --qt="$QT_ROOT_DIR"
          xmake build -y imageviewer
          xmake build -y imageviewer-metadata-tests
          xmake build -y imageviewer-tests
          xmake build -y imageviewer-bench

      - name: Run ImageViewer metadata tests
        working-directory: ${{ steps.imageviewer_project.outputs.directory }}
        run: xmake run imageviewer-metadata-tests

      - name: Run ImageViewer integration tests (Linux X11)
        if: runner.os == 'Linux'
        working-directory: ${{ steps.imageviewer_project.outputs.directory }}
        env:
          QT_QPA_PLATFORM: xcb
          QT_QUICK_BACKEND: software
        run: xvfb-run -a xmake run imageviewer-tests

      - name: Run ImageViewer integration tests (Windows/macOS)
        if: runner.os != 'Linux'
        working-directory: ${{ steps.imageviewer_project.outputs.directory }}
        env:
          QT_QUICK_BACKEND: software
        run: xmake run imageviewer-tests

      - name: Run ImageViewer benchmark (Linux)
        if: runner.os == 'Linux'
        working-directory: ${{ steps.imageviewer_project.outputs.directory }}
        env:
          QT_QPA_PLATFORM: offscreen
        run: xmake run imageviewer-bench

      - name: Run ImageViewer benchmark (Windows/macOS)
        if: runner.os != 'Linux'
        working-directory: ${{ steps.imageviewer_project.outputs.directory }}
        run: xmake run imageviewer-bench

      - name: Build ImageViewer Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        working-directory: ${{ steps.imageviewer_project.outputs.directory }}
        shell: pwsh
        run: ./Packaging/package-windows.ps1

      - name: Build ImageViewer macOS installer (productbuild)
        if: runner.os == 'macOS'
        working-directory: ${{ steps.imageviewer_project.outputs.directory }}
        shell: bash
        run: bash Packaging/package-macos.sh

      - name: Build ImageViewer Linux installer (Debian package)
        if: runner.os == 'Linux'
        working-directory: ${{ steps.imageviewer_project.outputs.directory }}
        shell: bash
        run: bash Packaging/package-linux.sh

      - name: Upload ImageViewer Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.imageviewer_project.outputs.directory }}/artifacts/ImageViewer-windows-x64-setup.exe
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload ImageViewer macOS installer
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.imageviewer_project.outputs.directory }}/artifacts/ImageViewer-macos-arm64.pkg
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload ImageViewer Linux installer
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.imageviewer_project.outputs.directory }}/artifacts/ImageViewer-linux-x64.deb
          archive: false
          if-no-files-found: error
          retention-days: 14

      # Screenshot Tool uses the existing three runners and Qt setup.
      - name: Locate ScreenshotTool project
        id: screenshot_project
        shell: bash
        run: |
          for dir in ScreenshotTool ScreenshotTool/ScreenshotTool; do
            if [[ -f "$dir/xmake.lua" && -f "$dir/App/main.cpp" && -f "$dir/UI/Overlay.qml" && -f "$dir/Tests/Tests.cpp" ]]; then
              printf 'directory=%s\n' "$dir" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo '::error::ScreenshotTool project not found. Extract ScreenshotTool.zip at the repository root, preserving paths.'
          exit 1

      - name: Build ScreenshotTool (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ steps.screenshot_project.outputs.directory }}
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          xmake f -c -y -P . -F xmake.lua -p windows -a x64 -m release --vs=2022 "--qt=$env:QT_ROOT_DIR"
          xmake build -y screenshottool
          xmake build -y screenshottool-geometry-tests
          xmake build -y screenshottool-tests
          xmake build -y screenshottool-bench

      - name: Build ScreenshotTool (Linux/macOS)
        if: runner.os != 'Windows'
        working-directory: ${{ steps.screenshot_project.outputs.directory }}
        shell: bash
        run: |
          xmake f -c -y -P . -F xmake.lua -p "${{ matrix.xmake_platform }}" -a "${{ matrix.xmake_arch }}" -m release --qt="$QT_ROOT_DIR"
          xmake build -y screenshottool
          xmake build -y screenshottool-geometry-tests
          xmake build -y screenshottool-tests
          xmake build -y screenshottool-bench

      - name: Run ScreenshotTool geometry tests
        working-directory: ${{ steps.screenshot_project.outputs.directory }}
        run: xmake run screenshottool-geometry-tests

      - name: Run ScreenshotTool integration tests (Linux X11)
        if: runner.os == 'Linux'
        working-directory: ${{ steps.screenshot_project.outputs.directory }}
        env:
          QT_QPA_PLATFORM: xcb
          QT_QUICK_BACKEND: software
          SCREENSHOT_NATIVE_TEST: '1'
        run: xvfb-run -a xmake run screenshottool-tests

      - name: Run ScreenshotTool integration tests (Windows/macOS)
        if: runner.os != 'Linux'
        working-directory: ${{ steps.screenshot_project.outputs.directory }}
        env:
          QT_QUICK_BACKEND: software
        run: xmake run screenshottool-tests

      - name: Run ScreenshotTool benchmarks (Linux)
        if: runner.os == 'Linux'
        working-directory: ${{ steps.screenshot_project.outputs.directory }}
        env:
          QT_QPA_PLATFORM: xcb
        run: xvfb-run -a xmake run screenshottool-bench --capture

      - name: Run ScreenshotTool benchmarks (Windows/macOS)
        if: runner.os != 'Linux'
        working-directory: ${{ steps.screenshot_project.outputs.directory }}
        run: xmake run screenshottool-bench

      - name: Build ScreenshotTool Windows installer
        if: runner.os == 'Windows'
        working-directory: ${{ steps.screenshot_project.outputs.directory }}
        shell: pwsh
        run: ./Packaging/package-windows.ps1

      - name: Build ScreenshotTool macOS installer
        if: runner.os == 'macOS'
        working-directory: ${{ steps.screenshot_project.outputs.directory }}
        shell: bash
        run: bash Packaging/package-macos.sh

      - name: Build ScreenshotTool Linux installer
        if: runner.os == 'Linux'
        working-directory: ${{ steps.screenshot_project.outputs.directory }}
        shell: bash
        run: bash Packaging/package-linux.sh

      - name: Upload ScreenshotTool Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.screenshot_project.outputs.directory }}/artifacts/ScreenshotTool-windows-x64-setup.exe
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload ScreenshotTool macOS installer
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.screenshot_project.outputs.directory }}/artifacts/ScreenshotTool-macos-arm64.pkg
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload ScreenshotTool Linux installer
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.screenshot_project.outputs.directory }}/artifacts/ScreenshotTool-linux-x64.deb
          archive: false
          if-no-files-found: error
          retention-days: 14

      # Media Player: uses official libVLC packages, no MSVC import-library
      # conversion, package-recipe compilation or codec downloads by Xmake.
      - name: Locate MediaPlayer project
        id: mediaplayer_project
        shell: bash
        run: |
          for dir in MediaPlayer MediaPlayer/MediaPlayer; do
            if [[ -f "$dir/xmake.lua" && -f "$dir/App/Player.cpp" && -f "$dir/UI/Controls.qml" && -f "$dir/Tests/fixtures/sample.mkv" ]]; then
              printf 'directory=%s\n' "$dir" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo '::error::MediaPlayer project not found. Extract MediaPlayer.zip at the repository root, preserving paths.'
          exit 1

      - name: Install libVLC SDK and runtime (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ steps.mediaplayer_project.outputs.directory }}
        shell: pwsh
        run: ./Packaging/fetch-vlc-windows.ps1

      - name: Install libVLC SDK and runtime (macOS)
        if: runner.os == 'macOS'
        working-directory: ${{ steps.mediaplayer_project.outputs.directory }}
        shell: bash
        run: bash Packaging/fetch-vlc-macos.sh

